[project]
name = "rag-engine"
version = "0.1.0"
description = "Production-grade hybrid-retrieval RAG engine with citation-enforced answers"
readme = "README.md"
authors = [
    { name = "Orinameh", email = "memefacto@yahoo.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asgiref>=3.13.0",
    "asyncpg>=0.32.0",
    "celery[redis]>=5.7.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.3",
    "openai>=3.46.0",
    "orjson>=3.13.0",
    "pgvector>=0.5.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "redis>=8.1.0",
    "sentence-transformers>=6.2.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "sse-starlette>=3.6.0",
    "tenacity>=9.2.1",
    "tiktoken>=0.14.0",
    "torch>=2.15.0",
    "unstructured[docx,pdf]>=0.27.37",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
rag-engine = "rag_engine:main"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
# sentence-transformers and torchvision also depend on torch, so uv will resolve them fine

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]
