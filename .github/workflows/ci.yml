name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + type check + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # tiktoken fetches its BPE tables on first run; restoring the cache
      # before tests keeps the pipeline off external endpoints.
      - name: tiktoken cache
        if: always()
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/tiktoken
          key: tiktoken-${{ runner.os }}

      # uv resolves the lockfile and manages its own Python (3.14) — no
      # separate actions/setup-python needed. Cache keyed on the lockfile.
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check src/ tests/ scripts/eval.py

      - name: ty (type check)
        run: uv run ty check src/ tests/ scripts/eval.py

      - name: pytest (unit tests)
        run: uv run pytest tests/ -q --tb=short

  # Backs the "CI gate" story: a passing test run is worthless if the
  # package no longer ships. Builds sdist + wheel (uv_build backend), then
  # installs JUST the wheel in a scratch venv and imports the package —
  # catching missing modules/deps that tests never trip because they run
  # from the source tree with uv's dev resolution.
  build:
    name: build (sdist + wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Build
        run: uv build

      - name: Wheel installs and imports clean (no source tree, no dev deps)
        run: |
          uv venv verify
          uv pip install --python verify/bin/python dist/*.whl
          verify/bin/python -c "import rag_engine; import importlib, rag_engine.api.app; print('wheel OK:', rag_engine.__name__)"

      - uses: actions/upload-artifact@v4
        if: always() && github.ref == 'refs/heads/main'
        with:
          name: dist
          path: dist/
          retention-days: 7
